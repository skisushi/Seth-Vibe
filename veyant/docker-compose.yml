services:

  # ── Flask REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .          # build context is veyant/ so both api/ and db/ are reachable
      dockerfile: api/Dockerfile
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "false"
    volumes:
      - db_data:/app/db   # persist the SQLite database file across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/travelers')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── React frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"         # access the app at http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:                # named volume for SQLite persistence
